# Despliegue a Cloudflare Workers (OpenNext) en cada push a master.
# El build se hace aquí (runner Linux) porque en Windows opennextjs-cloudflare
# falla al trazar node_modules. Secrets necesarios en el repo:
#   CLOUDFLARE_API_TOKEN  — token con permisos de Workers + KV
#   CLOUDFLARE_ACCOUNT_ID — Account ID de la cuenta de Cloudflare
#
# Afiliados: las páginas son SSG y src/lib/affiliates.ts lee process.env durante
# el build. Por eso los AFF_* deben inyectarse explícitamente en el paso de build.
# Si un secret no existe, GitHub lo resuelve como cadena vacía y el código conserva
# la URL fallback sin romper el despliegue.
name: Deploy a Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar configuración de afiliados
        env:
          AFF_CIVITATIS: ${{ secrets.AFF_CIVITATIS }}
          AFF_KLOOK: ${{ secrets.AFF_KLOOK }}
          AFF_IATI: ${{ secrets.AFF_IATI }}
          AFF_HEYMONDO: ${{ secrets.AFF_HEYMONDO }}
          AFF_HOLAFLY: ${{ secrets.AFF_HOLAFLY }}
          AFF_AIRALO: ${{ secrets.AFF_AIRALO }}
          AFF_SKYSCANNER: ${{ secrets.AFF_SKYSCANNER }}
          AFF_JRPASS: ${{ secrets.AFF_JRPASS }}
          AFF_REVOLUT: ${{ secrets.AFF_REVOLUT }}
          AFF_BOOKING: ${{ secrets.AFF_BOOKING }}
          AFF_GETYOURGUIDE: ${{ secrets.AFF_GETYOURGUIDE }}
        run: |
          configured=0
          for name in AFF_CIVITATIS AFF_KLOOK AFF_IATI AFF_HEYMONDO AFF_HOLAFLY AFF_AIRALO AFF_SKYSCANNER AFF_JRPASS AFF_REVOLUT AFF_BOOKING AFF_GETYOURGUIDE; do
            if [ -n "${!name:-}" ]; then
              echo "${name}: configured"
              configured=$((configured + 1))
            else
              echo "${name}: missing"
            fi
          done
          echo "Affiliate programs configured: ${configured}/11"

      - name: Comprobar integraciones runtime de producto
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # `wrangler secret list` devuelve solo nombres/tipos, nunca valores.
          # Es diagnóstico: una integración opcional ausente no debe bloquear el sitio.
          if secret_json=$(npx wrangler secret list --format json 2>/dev/null); then
            for name in MAILERLITE_API_KEY MAILERLITE_GROUP_ID; do
              if printf '%s' "$secret_json" | jq -e --arg name "$name" 'any(.[]; .name == $name)' >/dev/null; then
                echo "${name}: configured"
              else
                echo "${name}: missing"
              fi
            done
          else
            echo "Runtime secrets: unable to inspect (non-blocking)"
          fi

      - name: Build OpenNext (incluye next build)
        run: npx opennextjs-cloudflare build
        env:
          AFF_CIVITATIS: ${{ secrets.AFF_CIVITATIS }}
          AFF_KLOOK: ${{ secrets.AFF_KLOOK }}
          AFF_IATI: ${{ secrets.AFF_IATI }}
          AFF_HEYMONDO: ${{ secrets.AFF_HEYMONDO }}
          AFF_HOLAFLY: ${{ secrets.AFF_HOLAFLY }}
          AFF_AIRALO: ${{ secrets.AFF_AIRALO }}
          AFF_SKYSCANNER: ${{ secrets.AFF_SKYSCANNER }}
          AFF_JRPASS: ${{ secrets.AFF_JRPASS }}
          AFF_REVOLUT: ${{ secrets.AFF_REVOLUT }}
          AFF_BOOKING: ${{ secrets.AFF_BOOKING }}
          AFF_GETYOURGUIDE: ${{ secrets.AFF_GETYOURGUIDE }}

      - name: Deploy a Cloudflare
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verificar en producción con GET
        run: |
          URL="https://viajajapon.com"
          TS=$(date +%s)

          check_redirect() {
            local ORIGIN=$1
            local PATHNAME=$2
            local EXPECTED=$3
            local STATUS
            local LOCATION

            STATUS=$(curl -sS --max-redirs 0 -D temp_redirect_headers.txt -o /dev/null -w "%{http_code}" "${ORIGIN}${PATHNAME}") || return 1
            LOCATION=$(tr -d '\r' < temp_redirect_headers.txt | awk 'tolower($1) == "location:" {print $2; exit}')

            # 301 y 308 son redirecciones permanentes válidas. Next usa 308,
            # pero un alias puede resolverse antes mediante Cloudflare/registrador con 301.
            case "$STATUS" in
              301|308) ;;
              *)
                echo "❌ Expected permanent redirect (301/308) from ${ORIGIN}${PATHNAME}, got ${STATUS}"
                return 1
                ;;
            esac
            if [ "$LOCATION" != "$EXPECTED" ]; then
              echo "❌ Wrong Location from ${ORIGIN}${PATHNAME}: ${LOCATION} (expected ${EXPECTED})"
              return 1
            fi
            echo "✅ ${ORIGIN}${PATHNAME} -> ${LOCATION} (${STATUS})"
          }

          run_all_checks() {
            check_url() {
              local PATHNAME=$1
              local EXPECTED_1=$2
              local EXPECTED_2=$3
              local NOT_EXPECTED=$4

              for SUFFIX in "" "?audit=$TS"; do
                local TARGET="${URL}${PATHNAME}${SUFFIX}"
                echo "Checking: $TARGET"

                HTTP_STATUS=$(curl -sS -o temp_body.html -w "%{http_code}" "$TARGET")

                if [ "$HTTP_STATUS" != "200" ]; then
                  echo "❌ ERROR: Status $HTTP_STATUS for $TARGET"
                  cat temp_body.html
                  return 1
                fi

                if [ -n "$EXPECTED_1" ]; then
                  if ! grep -Fq "$EXPECTED_1" temp_body.html; then echo "❌ Missing '$EXPECTED_1'"; return 1; fi
                fi
                if [ -n "$EXPECTED_2" ]; then
                  if ! grep -Fq "$EXPECTED_2" temp_body.html; then echo "❌ Missing '$EXPECTED_2'"; return 1; fi
                fi
                if [ -n "$NOT_EXPECTED" ]; then
                  if grep -Fq "$NOT_EXPECTED" temp_body.html; then echo "❌ Found forbidden '$NOT_EXPECTED'"; return 1; fi
                fi

                echo "✅ 200 OK - Passed assertions"
              done
            }

            echo "Starting rigorous GET assertions..."
            check_url "/" "La guía de" "" "" || return 1
            check_url "/blog" "Subida del JR Pass" "" "0 guías y noticias" || return 1
            check_url "/destinos" "Dónde dormir en Tokio" "Qué ver en Osaka" "Estamos publicando estas guías; vuelve pronto" || return 1
            check_url "/destinos/donde-dormir-en-tokio" "Dónde dormir en Tokio" "" "" || return 1
            check_url "/destinos/donde-dormir-en-kioto" "Dónde dormir en Kioto" "" "" || return 1
            check_url "/destinos/que-ver-en-osaka" "Qué ver en Osaka" "" "" || return 1
            check_url "/cultura/geishas-y-maiko-japon" "Geisha, geiko y maiko" "Sin acoso ni fotos" "" || return 1
            check_url "/cultura/festivales-de-japon" "Festivales de Japón 2026" "Kagematsuri" "" || return 1
            check_url "/gastronomia/tipos-restaurantes-japon" "Tipos de restaurantes" "" "" || return 1
            check_url "/herramientas/jr-pass-calculadora" "¿Merece la pena el JR Pass en 2026?" "" "" || return 1
            check_url "/contacto" "Contacto" "info@viajajapon.com" "" || return 1
            check_url "/politica-editorial" "Política editorial" "Uso de herramientas de IA" "" || return 1

            check_url "/cambio-yen-euro" "Cambio de referencia" "Valor estimado de referencia" "" || return 1
            grep -Fq "1€ = ¥" temp_body.html || { echo "❌ Missing '1€ = ¥'"; return 1; }

            check_url "/embed/cambio-yen" 'id="r-disp"' 'id="e"' "" || return 1
            grep -Fq 'id="y"' temp_body.html || { echo "❌ Missing 'id=\"y\"'"; return 1; }
            grep -Fq "api.frankfurter.dev" temp_body.html || { echo "❌ Missing 'api.frankfurter.dev'"; return 1; }
            grep -Fq "Valor estimado de referencia" temp_body.html || { echo "❌ Missing 'Valor estimado de referencia'"; return 1; }

            check_url "/feed.xml" "<item>" "ViajaJapón" "" || return 1
            check_url "/ads.txt" "google.com, pub-7277317479691987" "" "" || return 1

            curl -sS "${URL}/robots.txt?audit=$TS" -o temp_robots.txt || return 1
            grep -Fq "Disallow: /embed" temp_robots.txt || { echo "❌ robots.txt must block /embed"; return 1; }
            if grep -Fq "Disallow: /buscar" temp_robots.txt; then echo "❌ /buscar must be crawlable so its noindex can be read"; return 1; fi

            curl -sS "${URL}/buscar?audit=$TS" -o temp_search.html || return 1
            grep -Fq "noindex" temp_search.html || { echo "❌ /buscar missing noindex"; return 1; }

            curl -sS "${URL}/api/suscribir" -o temp_newsletter.json || return 1
            jq -e 'has("available") and (.available | type == "boolean")' temp_newsletter.json >/dev/null || {
              echo "❌ Newsletter availability endpoint returned an invalid shape"
              cat temp_newsletter.json
              return 1
            }

            curl -sS -D temp_security_headers.txt -o /dev/null "$URL/" || return 1
            tr -d '\r' < temp_security_headers.txt | grep -qi '^x-content-type-options: nosniff$' || { echo "❌ Missing nosniff header"; return 1; }
            tr -d '\r' < temp_security_headers.txt | grep -qi '^x-frame-options: DENY$' || { echo "❌ Missing X-Frame-Options DENY"; return 1; }
            tr -d '\r' < temp_security_headers.txt | grep -qi '^referrer-policy: strict-origin-when-cross-origin$' || { echo "❌ Missing Referrer-Policy"; return 1; }

            echo "Checking alternate domains and www canonicalization..."
            check_redirect "https://viajajapon.es" "/" "https://viajajapon.com/" || return 1
            check_redirect "https://viajajapon.es" "/logistica/jr-pass-2026" "https://viajajapon.com/logistica/jr-pass-2026" || return 1
            check_redirect "https://www.viajajapon.es" "/" "https://viajajapon.com/" || return 1
            check_redirect "https://www.viajajapon.com" "/" "https://viajajapon.com/" || return 1

            return 0
          }

          for attempt in 1 2 3 4 5 6; do
            if run_all_checks; then
              echo "¡Todas las comprobaciones de producción pasaron!"
              exit 0
            fi

            echo "Intento $attempt fallido; reintentando..."
            sleep 10
          done

          exit 1
