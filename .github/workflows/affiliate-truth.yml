name: Affiliate Truth Guardrail

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  affiliate-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject blanket affiliate disclosures in content
        shell: bash
        run: |
          set -euo pipefail

          if grep -RIn --include='*.mdx' 'Este artículo incluye enlaces de afiliado' content/; then
            echo '❌ No hardcodees una divulgación global de afiliación en MDX.'
            echo 'La divulgación debe depender del estado real de monetización del partner mediante AffiliateBox.'
            exit 1
          fi

          echo '✅ No hay divulgaciones globales de afiliación hardcodeadas.'

      - name: Verify conditional sponsored relation
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'rel={monetized ? "sponsored nofollow noopener noreferrer" : "noopener noreferrer"}' src/components/TrackedAffiliateLink.tsx || {
            echo '❌ TrackedAffiliateLink debe marcar sponsored solo cuando monetized=true.'
            exit 1
          }

          grep -Fq 'const effectiveCta = monetized ? cta : neutralCta(partner, destino);' src/components/AffiliateBox.tsx || {
            echo '❌ AffiliateBox debe usar un CTA neutral (neutralCta) cuando no existe monetización.'
            exit 1
          }

          grep -Fq 'export function neutralCta' src/lib/affiliates.ts || {
            echo '❌ affiliates.ts debe exportar neutralCta: el CTA sin tracking nunca promete comisión ni llama "oficial" a una tienda.'
            exit 1
          }

          echo '✅ Estado de monetización, rel y CTA están alineados.'

      - name: Verify Booking destination registry
        shell: bash
        run: |
          set -euo pipefail

          FILE=src/data/booking-links.ts
          grep -Fq 'const BK = "https://www.booking.com";' "$FILE" || {
            echo '❌ booking-links.ts debe construir las URL canónicas sobre https://www.booking.com.'
            exit 1
          }

          # Cada destino apunta a booking.com (las URL canónicas no pagan; el tracking va aparte).
          if grep -E '^\s+"?[a-z][a-z0-9-]*"?: \{ label:' "$FILE" | grep -v 'url: `${BK}/'; then
            echo '❌ Hay destinos de Booking cuya URL canónica no es de booking.com.'
            exit 1
          fi

          # La plantilla de CJ, si existe, debe llevar {url}: sin él todos los destinos irían a la misma página.
          TEMPLATE=$(grep -E '^export const BOOKING_DEEPLINK_TEMPLATE' "$FILE")
          if ! echo "$TEMPLATE" | grep -Fq '= null;' && ! echo "$TEMPLATE" | grep -Fq '{url}'; then
            echo '❌ BOOKING_DEEPLINK_TEMPLATE debe ser null o contener {url}.'
            exit 1
          fi

          echo '✅ Registro de destinos de Booking coherente.'
